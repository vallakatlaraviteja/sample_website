<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <meta name="description" content="TerraPulse - real-time 3D Earth dashboard fusing live world and tech signals." />
  <title>TerraPulse - Live Pulse of the Planet</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="globe-container" aria-label="Interactive 3D globe of Earth"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo-dot"></span>
      <span class="brand-name">TerraPulse</span>
      <span class="brand-tag">live pulse of the planet</span>
    </div>
    <nav class="layers" role="group" aria-label="Data layers">
      <button class="layer-btn active" data-layer="quakes">
        <span class="layer-dot" style="--c:#ef4444"></span>Quakes <em id="count-quakes">-</em>
      </button>
      <button class="layer-btn active" data-layer="tech">
        <span class="layer-dot" style="--c:#22d3ee"></span>Tech <em id="count-tech">-</em>
      </button>
      <button class="layer-btn active" data-layer="iss">
        <span class="layer-dot" style="--c:#facc15"></span>ISS
      </button>
      <button class="layer-btn active" data-layer="pulses">
        <span class="layer-dot" style="--c:#a78bfa"></span>Pulses <em id="count-pulses">-</em>
      </button>
    </nav>
    <button class="add-btn" id="add-pulse-btn" aria-haspopup="dialog">+ Add Pulse</button>
  </header>

  <aside class="side-panel" id="side-panel" aria-live="polite">
    <div class="panel-header">
      <h2>Signals</h2>
      <span class="status" id="status-text">connecting…</span>
    </div>
    <div class="panel-tabs" role="tablist">
      <button class="tab active" data-tab="recent">Recent</button>
      <button class="tab" data-tab="quakes">Quakes</button>
      <button class="tab" data-tab="tech">Tech</button>
      <button class="tab" data-tab="pulses">Pulses</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <button class="panel-toggle" id="panel-toggle" aria-label="Toggle side panel">‹</button>

  <footer class="bottom-hint">
    <span>Drag to rotate · Scroll to zoom · Click markers for detail</span>
  </footer>

  <!-- Add Pulse Modal -->
  <dialog id="pulse-modal" class="modal">
    <form method="dialog" id="pulse-form">
      <h3>Drop a Pulse</h3>
      <p class="modal-sub">Geo-tag a tech, science, or world event. Click globe to set location.</p>
      <label>Title <input name="title" maxlength="140" required placeholder="e.g. Open-source AI summit" /></label>
      <label>Category
        <select name="category" required>
          <option value="tech">Tech</option>
          <option value="science">Science</option>
          <option value="climate">Climate</option>
          <option value="space">Space</option>
          <option value="health">Health</option>
          <option value="culture">Culture</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>Description <textarea name="description" maxlength="1000" rows="3" placeholder="What's happening?"></textarea></label>
      <label>URL <input name="url" type="url" placeholder="https://..." /></label>
      <div class="latlng-row">
        <label>Lat <input name="lat" type="number" step="0.0001" min="-90" max="90" required /></label>
        <label>Lng <input name="lng" type="number" step="0.0001" min="-180" max="180" required /></label>
      </div>
      <p class="hint" id="pulse-hint">Tip: close this and click anywhere on the globe to set lat/lng.</p>
      <div class="modal-actions">
        <button type="button" id="cancel-pulse" class="btn-ghost">Cancel</button>
        <button type="submit" class="btn-primary">Drop Pulse</button>
      </div>
    </form>
  </dialog>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Booting the planet…</p>
  </div>

  <!-- Three.js + globe.gl from CDN. Pinned versions for stability. -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.32.4/dist/globe.gl.min.js"></script>
  <script src="/main.js" type="module"></script>
</body>
</html>
