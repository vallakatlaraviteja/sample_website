services:
  - type: web
    name: terrapulse
    runtime: node
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: terrapulse-db
          property: connectionString
      - key: DISABLE_DB
        value: "false"

databases:
  - name: terrapulse-db
    plan: free
    databaseName: terrapulse
    user: terrapulse
